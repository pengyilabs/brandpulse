  <defs>
    <linearGradient id="bp-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4B56F2"/>
      <stop offset="100%" stop-color="#6A4FFF"/>
    </linearGradient>
  </defs>
  <!-- Pulse-wave B tile — BrandPulse monogram 32x32 -->
