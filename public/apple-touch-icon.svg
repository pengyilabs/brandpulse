<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="BrandPulse">
  <defs>
    <linearGradient id="apt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4B56F2"/>
      <stop offset="100%" stop-color="#6A4FFF"/>
    </linearGradient>
  </defs>
  <!-- No rounded corners — iOS auto-masks to rounded square for home screen icons -->
  <rect width="180" height="180" rx="40" fill="url(#apt)"/>
  <g transform="translate(20 20) scale(4.375)">
    <!-- 32x32 glyph scaled to 140x140, 20pt padding on each side -->
    <path d="M9 6.5h8.2a4.8 4.8 0 0 1 0 9.6H9V6.5z" fill="#fff"/>
    <path d="M9 15.9h9.6a4.8 4.8 0 0 1 0 9.6H9V15.9z" fill="#fff"/>
    <rect x="9" y="6.5" width="3.2" height="19" rx="1.2" fill="#fff"/>
    <polyline points="12.6,17.5 15.1,14.6 17.5,12.0 20.0,15.0 22.4,18.0"
      fill="none" stroke="#4B56F2" stroke-width="1.85"
      stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
