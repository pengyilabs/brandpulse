<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />

    <!-- ── Brand identity / SEO ─────────────────────────────────────────────────────── -->
    <title>BrandPulse — AI Brand Audit &amp; Content Studio</title>
    <meta
      name="description"
      content="BrandPulse is a white-label AI platform that audits social brand signals, benchmarks competitors, and generates on-brand multi-channel content at scale — for agencies and modern marketing teams."
    />
    <meta name="keywords" content="brand analytics, AI content generation, competitive intelligence, brand audit, social listening, marketing SaaS, agency dashboard, brand guidelines, content calendar" />
    <meta name="author" content="BrandPulse" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <link rel="canonical" href="https://brandpulse.app/" />
    <link rel="alternate" hreflang="en" href="https://brandpulse.app/" />
    <link rel="alternate" hreflang="zh-CN" href="https://brandpulse.app/zh/" />
    <link rel="alternate" hreflang="x-default" href="https://brandpulse.app/" />

    <!-- ── Theme colors (match light/dark CSS vars) ────────────────────────────────── -->
    <meta name="theme-color" content="#4B56F2" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#3A44D8" media="(prefers-color-scheme: light)" />
    <meta name="msapplication-TileColor" content="#4B56F2" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BrandPulse" />
    <meta name="application-name" content="BrandPulse" />
    <meta name="format-detection" content="telephone=no" />

    <!-- ── Open Graph ──────────────────────────────────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BrandPulse" />
    <meta property="og:title" content="BrandPulse — AI Brand Audit &amp; Content Studio" />
    <meta
      property="og:description"
      content="White-label AI platform for brand pulse audits, competitive benchmarking, and on-brand multi-channel content generation."
    />
    <meta property="og:url" content="https://brandpulse.app/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="zh_CN" />
    <meta property="og:image" content="/logo.svg" />
    <meta property="og:image:secure_url" content="https://brandpulse.app/logo.svg" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:width" content="240" />
    <meta property="og:image:height" content="44" />
    <meta property="og:image:alt" content="BrandPulse wordmark — pulse-wave B monogram" />

    <!-- ── Twitter Card ────────────────────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@brandpulse" />
    <meta name="twitter:creator" content="@brandpulse" />
    <meta name="twitter:title" content="BrandPulse — AI Brand Audit &amp; Content Studio" />
    <meta
      name="twitter:description"
      content="White-label AI platform for brand pulse audits, competitive benchmarking, and on-brand multi-channel content generation."
    />
    <meta name="twitter:image" content="/logo.svg" />
    <meta name="twitter:image:alt" content="BrandPulse wordmark — pulse-wave B monogram" />

    <!-- ── Favicons & App Icons (SVG pack, theme-aware) ────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="icon" type="image/svg+xml" sizes="16x16" href="/favicon-16x16.svg" />
    <link rel="icon" type="image/svg+xml" sizes="32x32" href="/favicon-32x32.svg" />
    <link rel="shortcut icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" type="image/svg+xml" sizes="180x180" href="/apple-touch-icon.svg" />
    <link rel="mask-icon" href="/logo-icon.svg" color="#4B56F2" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="image_src" href="/logo.svg" />

    <!-- ── Preconnects (mobile perf) ───────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- ── Critical root sizing / no-fouc background ───────────────────────────────── -->
    <style>
      html, body { height: 100%; margin: 0; }
      #root { height: 100%; }
      html, body { background: #0B0E14; color: #FAFAFA; }
      html[data-theme="light"], html[data-theme="light"] body { background: #FFFFFF; color: #0B0E14; }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
